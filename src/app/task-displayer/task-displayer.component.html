<div class="task-header">
    <p>Current tasks:</p>
</div>

<table *ngIf="(taskList$ | async)?.tasks as tasks; else loading" class="task-table">
    <tr>
        <th>Title</th>
        <th>Status</th>
        <th>Type</th>
        <th>Created On</th>
        <th>Description</th>
        <th>Actions</th>
    </tr>
    <tr *ngFor="let task of tasks" class="task-row">
        <td><a [routerLink]="['/task-details', task.id]" routerLinkActive="active" ariaCurrentWhenActive="page" class="header-button">{{task.title}}</a></td>
        <td>{{task.status}}</td>
        <td>{{task.type}}</td>
        <td>{{task.createdOn}}</td>
        <td>{{task.description}}</td>
        <td>
            <button class="delete-button" (click)="deleteTask(task.id)">Delete</button>
        </td>
    </tr>
</table>

<ng-template #loading>
    <p>Loading tasks...</p>
</ng-template>

<ng-container *ngIf="(taskList$ | async)?.tasks?.length === 0">
    <p>No tasks available</p>
</ng-container>
